name: Shell checks

on:
  pull_request:
    branches:
      - main
      - testing
  push:
    branches:
      - main
      - testing

permissions:
  contents: read

jobs:
  shell-validation:
    name: Shell validation
    runs-on: [self-hosted, Linux, X64]
    container: ubuntu:24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install analysis tools
        timeout-minutes: 10
        env:
          DEBIAN_FRONTEND: noninteractive
          TZ: Etc/UTC
        run: |
          set -euo pipefail
          apt-get update
          apt-get install --yes shellcheck shfmt ripgrep python3 coreutils util-linux

      - name: Check Bash syntax
        shell: bash
        run: |
          set -euo pipefail

          while IFS= read -r -d '' script; do
            echo "Checking syntax: $script"
            bash -n "$script"
          done < <(
            find . -type f -name '*.sh' \
              -not -path './.git/*' \
              -print0
          )

      - name: Run ShellCheck
        shell: bash
        run: |
          set -euo pipefail

          mapfile -d '' scripts < <(
            find . -type f -name '*.sh' \
              -not -path './.git/*' \
              -print0
          )

          if ((${#scripts[@]})); then
            shellcheck -S warning "${scripts[@]}"
          fi

      - name: Check formatting
        shell: bash
        run: |
          set -euo pipefail
          shfmt -d .

      - name: Run uninstall failure-path tests
        run: |
          set -euo pipefail
          # Ubuntu's existing unprivileged user preserves fixture HOME semantics.
          chown -R ubuntu:ubuntu "$GITHUB_WORKSPACE"
          runuser -u ubuntu -- env -u SUDO_USER HOME=/home/ubuntu bash -euo pipefail <<'TESTS'
          python3 tests/test-shell-workflow.py
          tests/test-uninstall.sh
          tests/test-maintainer-config.sh
          tests/test-shell-messages.sh
          tests/test-binder-lock.sh
          tests/test-package-transaction.sh
          tests/test-rootfs-package-ownership.sh
          tests/test-bundle-compatibility.sh
          tests/test-shared-folder.sh
          tests/test-waydroid-profiles.sh
          tests/test-test-environment.sh
          tests/test-remove-test-environment.sh
          tests/test-android-image-sources.sh
          TESTS
